<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocab Deck</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23333333'/%3E%3Ctext x='32' y='44' font-family='monospace' font-size='40' font-weight='bold' text-anchor='middle' fill='%23f4f0e4'%3EV%3C/text%3E%3Crect x='16' y='48' width='32' height='4' fill='%238bbde4'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Study vocabulary decks with flashcards, quizzes, typing and matching exercises."
    />
    <script>
      // Apply the saved theme before paint to avoid a flash. First-time
      // visitors default to light; only an explicit toggle choice is stored.
      (function () {
        try {
          var stored = window.localStorage.getItem("vocabdeck.theme");
          document.documentElement.dataset.theme =
            stored === "light" || stored === "dark" ? stored : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+Mono+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
